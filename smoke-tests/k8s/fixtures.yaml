# Serves smoke-tests/fixtures/ (loaded into the smoke-fixtures ConfigMap by CI)
# to the browser node pods as http://fixtures/ so timing-sensitive smoke tests
# don't depend on a third-party site's uptime. Test infrastructure only; not
# part of the Helm chart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixtures
  labels:
    app: fixtures
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixtures
  template:
    metadata:
      labels:
        app: fixtures
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /dynamic_loading.html
              port: 80
          volumeMounts:
            - name: pages
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: pages
          configMap:
            name: smoke-fixtures
---
apiVersion: v1
kind: Service
metadata:
  name: fixtures
spec:
  selector:
    app: fixtures
  ports:
    - port: 80
      targetPort: 80
